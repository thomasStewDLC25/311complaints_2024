<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map with Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.3.0/papaparse.min.js"></script>
</head>
<body>

    <!-- File input for uploading the CSV file -->
    <input type="file" id="csv-upload" accept=".csv" />
    
    <div id="map" style="height: 600px;"></div>

    <script>
        let neighborhoodsCsv = [];

        // Function to handle file upload and parse CSV
        document.getElementById('csv-upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                Papa.parse(file, {
                    complete: function(results) {
                        neighborhoodsCsv = results.data;
                        console.log(neighborhoodsCsv); // Log CSV content for debugging
                        initializeMap();  // Once CSV is loaded, initialize the map
                    }
                });
            }
        });

        // Function to initialize map after CSV is loaded
        function initializeMap() {
            if (neighborhoodsCsv.length === 0) {
                alert('No data loaded');
                return;
            }

            // Convert CSV to GeoJSON format for merged_gdf (simplified example here)
            let merged_gdf = {
                type: "FeatureCollection",
                features: neighborhoodsCsv.map(function(row) {
                    return {
                        type: "Feature",
                        properties: {
                            zipcode: row.zipcode,
                            rubbish_count: parseInt(row.rubbish_count, 10),
                            neighborhood: row.neighborhood
                        },
                        geometry: {
                            type: "Polygon", // Example: You would replace this with actual geometry data
                            coordinates: [
                                [
                                    [-73.998, 40.748],
                                    [-73.995, 40.748],
                                    [-73.995, 40.750],
                                    [-73.998, 40.750],
                                    [-73.998, 40.748]
                                ]
                            ]
                        }
                    };
                })
            };

            console.log("GeoJSON Data:", merged_gdf); // Log the GeoJSON data

            // Create map centered on Philadelphia (39.9526, -75.1652) with zoom level 12
            const map = L.map('map').setView([39.9526, -75.1652], 12);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Add GeoJSON layer to the map
            L.geoJSON(merged_gdf, {
                style: function (feature) {
                    // Ensure the feature's rubbish_count is set and valid
                    let fillColor = getColor(feature.properties.rubbish_count);
                    console.log("Fill Color for " + feature.properties.zipcode + ": " + fillColor);
                    return {
                        color: 'black',
                        weight: 1,
                        fillColor: fillColor,
                        fillOpacity: 0.7
                    };
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(`<strong>Zip Code:</strong> ${feature.properties.zipcode}<br><strong>311 Trash Pickup Complaints:</strong> ${feature.properties.rubbish_count}<br><strong>Neighborhood:</strong> ${feature.properties.neighborhood}`);
                }
            }).addTo(map);
        }

        // Function to get color based on rubbish count
        function getColor(rubbish_count) {
            if (rubbish_count <= 10) return '#fff5f0';
            if (rubbish_count <= 50) return '#fee0d2';
            if (rubbish_count <= 100) return '#fcbba1';
            return '#99000d';
        }
    </script>
</body>
</html>
